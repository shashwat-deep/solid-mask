<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Every file comes from this site and nothing else may load (CLAUDE.md, rule 2).
         'wasm-unsafe-eval' lets ONNX Runtime compile its WebAssembly; it allows no other code. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; img-src 'self' blob: data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
    <meta name="referrer" content="no-referrer">
    <title>solid-mask</title>
    <!-- An empty icon, so the browser does not ask the server for one after the page has loaded. -->
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="./src/style.css">
    <script type="module" src="./src/main.ts"></script>
  </head>
  <body>
    <main>
      <h1>solid-mask</h1>
      <p>Covers the faces in a photo with solid blocks. Your photo stays on this device.</p>
      <div class="actions">
        <button id="choose" type="button" disabled>Choose photos</button>
        <button id="save" type="button" disabled>Save</button>
      </div>
      <input id="file" type="file" accept="image/*" hidden>
      <p id="status" role="status">Loading…</p>
      <canvas id="photo" hidden></canvas>
    </main>
    <footer>
      <a href="./licences.txt">Licences</a> · <a href="https://github.com/shashwat-deep/solid-mask">Source code</a>
    </footer>
  </body>
</html>
