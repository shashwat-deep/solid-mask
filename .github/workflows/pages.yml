# Builds the app, runs the unit tests and the privacy suite in Chromium, Firefox and WebKit, checks
# the files the suite saved (check E2), and, on main, deploys to GitHub Pages exactly the files the
# suite has just tested. Runs the evaluation's own tests on Ubuntu and Windows.
# Actions are pinned to full commit SHAs; the comment after each gives its release.
name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its older run; runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            tests/package-lock.json

      - name: Install dependencies
        run: |
          npm ci --prefix app
          npm ci --prefix tests

      # The model and the test photos are downloaded and checked against their SHA-256s (never
      # committed); keep them between runs rather than fetch them every time.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            app/models
            tests/fixtures/data/*.jpg
          key: downloads-${{ hashFiles('app/src/pipeline/models.ts', 'tests/fixtures/photos.csv') }}

      - name: Install browsers
        working-directory: tests
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Build the app, then run the unit tests and the privacy suite
        working-directory: tests
        run: npm test

      # Check E2 (docs/eval-protocol.md, part E) on every copy the privacy suite saved, in all three
      # browsers together. It runs once eval/check_files.py is on the branch being tested.
      - name: Check the structure of the saved copies (E2)
        if: hashFiles('eval/check_files.py') != ''
        run: python3 eval/check_files.py tests/test-results --out tests/test-results/e2.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            tests/playwright-report/
            tests/test-results/
          retention-days: 14

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: app/dist/

  # The evaluation's own tests (eval/tests: made-up data only, never a test image), on both authors'
  # systems: path handling differs between Windows and the rest.
  eval:
    name: eval tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: eval/requirements.txt

      - name: Install the eval requirements and Chromium
        run: |
          python -m pip install -r eval/requirements.txt
          python -m playwright install ${{ runner.os == 'Linux' && '--with-deps' || '' }} --only-shell chromium

      - name: Run the eval tests
        run: python -m pytest eval/tests -q -p no:cacheprovider

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # One deployment at a time, and never cancel one that has started.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
